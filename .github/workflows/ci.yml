name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/payment-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test backend
        run: mvn test

      - name: Build backend
        run: mvn -DskipTests clean package

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/internet-banking
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/internet-banking/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:prod

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker compose build payment-service

      - name: Build frontend image
        run: docker compose build internet-banking

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [docker]
    defaults:
      run:
        working-directory: apps/internet-banking
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/internet-banking/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start application
        working-directory: .
        run: docker compose up -d --build

      - name: Wait for application
        working-directory: .
        run: |
          for i in {1..60}; do
            curl -fsS http://localhost:4200 >/dev/null \
              && curl -fsS http://localhost:8080/actuator/health >/dev/null \
              && exit 0
            sleep 2
          done
          docker compose ps
          docker compose logs payment-service internet-banking
          exit 1

      - name: Run E2E
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/internet-banking/playwright-report
          if-no-files-found: ignore
